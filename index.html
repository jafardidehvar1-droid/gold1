<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>دفتر طلا</title>
<style>
:root{--bg:#f5f7fc;--card:#ffffff;--tx:#141a2e;--mu:#7a839c;--gold:#4a6ff0;--ln:#e3e8f5;--gr:#1f9d55;--rd:#d64545;--sh:0 8px 28px rgba(24,63,193,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1322;--card:#161d33;--tx:#eef1fa;--mu:#9aa4c0;--ln:#252e4a;--gold:#6b8cff;--sh:0 8px 28px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:Vazirmatn,-apple-system,BlinkMacSystemFont,"SF Arabic","SF Pro Text",system-ui,Tahoma,sans-serif;color:var(--tx)}
body{background:var(--bg);background-image:linear-gradient(180deg,transparent 55%,rgba(24,63,193,.10));background-attachment:fixed;min-height:100vh;padding:16px 16px 130px;max-width:520px;margin:auto}
h1{font-size:30px;margin:6px 4px 14px;display:flex;justify-content:space-between;align-items:center}
.eye,.cbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);box-shadow:var(--sh);color:#fff;display:grid;place-items:center;padding:0}.eye svg,.cbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border-radius:28px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--ln)}
.card h3{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.card h3 a{font-size:13px;color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid small{color:var(--mu);font-size:12px;display:block}.grid b{font-size:16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:20px;flex:none}
.grow{flex:1;min-width:0}.grow small{display:block;color:var(--mu);font-size:12px}
.num{text-align:left;font-weight:700;direction:ltr;white-space:nowrap}
.pos{color:var(--gr)}.neg{color:var(--rd)}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:17px;font-weight:700;font-size:17px;font-family:inherit;margin-bottom:12px;background:var(--card);color:var(--tx);box-shadow:var(--sh);border:1px solid var(--ln)}
.btn.g{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.s{padding:11px;font-size:14px;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:center;max-width:520px;margin:auto;z-index:5}
.pill{background:#141a85;border-radius:999px;box-shadow:0 8px 28px rgba(20,26,133,.35);border:0;display:flex;padding:4px;flex:1}
.pill button,.tool{border:0;background:none;font-weight:600;font-size:11px;font-family:inherit;color:#fff;flex:1;padding:0;height:52px;justify-content:center;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1}
.pill button span{display:flex;height:22px}.pill button svg,.tool svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.pill .on{background:rgba(255,255,255,.18);color:#fff}
.tool{flex:none;width:60px;height:60px;border-radius:50%;background:#141a85;box-shadow:0 8px 28px rgba(20,26,133,.35);border:0;justify-content:center}
.tool.on{background:#1f27a8}
.coin{width:90px;height:90px;border-radius:50%;margin:24px auto 0;background:radial-gradient(circle at 35% 30%,#f3d38a,#cf9c43 55%,#8e6320);box-shadow:inset -6px -6px 14px rgba(0,0,0,.25),0 10px 24px rgba(142,99,32,.35);display:grid;place-items:center;color:#6b4710;text-decoration:none;outline:3px solid rgba(142,99,32,.55);outline-offset:-7px}.coin svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(1px 1px 0 rgba(255,235,170,.7))}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 4px 5px}
input,select,textarea{width:100%;padding:14px;border-radius:16px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.three label{margin:0 2px 6px;text-align:center}.three input{padding:14px 4px;text-align:center}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;border:1px solid var(--ln);margin-bottom:6px}
.seg button{flex:1;border:0;background:none;padding:11px;border-radius:999px;font-weight:700;font-size:15px;font-family:inherit;color:var(--tx)}
.seg .on{background:var(--gold);color:#fff}
.sum{background:var(--card);border-radius:16px;padding:12px;margin-top:12px;border:1px dashed var(--gold);font-size:14px;line-height:1.9}
.empty{text-align:center;color:var(--mu);padding:18px 0;font-size:14px}
.hide .m{filter:blur(7px)}.ttl{display:flex;align-items:center;gap:14px}.dt{display:flex;align-items:center;gap:8px;font-weight:600}.dt b{font-size:34px;color:var(--mu);line-height:1}.dt small{display:block;font-size:12px;color:var(--mu);line-height:1.35;font-weight:500}.kx{width:44px;height:44px;border-radius:50%;border:0;background:var(--ln);color:var(--tx);font-size:18px}.kd{direction:ltr;text-align:center;font-size:42px;font-weight:700;min-height:70px;margin:26px 0;overflow-x:auto;white-space:nowrap}.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kb{height:68px;border-radius:999px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:26px;font-family:inherit}.kb.ka{background:var(--ln)}.kb.ko{background:var(--gold);color:#fff}
.mono{direction:ltr;font-size:12px}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر طلا">
<meta name="theme-color" content="#141a85">
</head>
<body>
<div id="app"></div>
<nav>
<div class="pill" id="tabs"></div>
<button class="tool" id="toolb" onclick="go('tools')">🛠</button>
</nav>
<script>
var S={tx:[],ps:[],pay:[]},V='home',HID=false;
try{var r=localStorage.getItem('goldapp');if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem('goldapp',JSON.stringify(S))}catch(e){}}
var D='۰۱۲۳۴۵۶۷۸۹';
function norm(s){return String(s==null?'':s).replace(/[۰-۹]/g,function(d){return D.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[,٬]/g,'').replace('٫','.')}
function num(v){return parseFloat(norm(v))||0}
function money(n){return Math.round(n).toLocaleString('fa-IR')}
function wt(n){return (Math.round(n*1000)/1000).toLocaleString('fa-IR',{maximumFractionDigits:3})}
function fd(s){return String(s).replace(/\d/g,function(d){return D[d]})}
function today(){var p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o={};p.forEach(function(x){o[x.type]=x.value});return o.year+'/'+o.month+'/'+o.day}
function nd(s){var a=norm(s).split(/[\/\-.]/);if(a.length!=3)return null;return a[0]+'/'+('0'+a[1]).slice(-2)+'/'+('0'+a[2]).slice(-2)}
var MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function mname(k){var a=k.split('/');return MN[+a[1]-1]+' '+fd(a[0])}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function m(h){return '<span class="m">'+h+'</span>'}
function sgn(n,h){return '<span class="'+(n>0.5?'pos':n<-0.5?'neg':'')+'">'+h+'</span>'}

// محاسبه موجودی و سود (میانگین قیمت خرید)
function calc(){
 var inv={},T=S.tx.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1)}),prof=0,buy=0,sell=0;
 T.forEach(function(t){
  var k=t.item+'|'+t.karat,I=inv[k]||(inv[k]={item:t.item,karat:t.karat,w:0,c:0}),g=t.w*t.p;
  if(t.type=='buy'){t.net=g+t.wage+t.tax+t.fee;I.w+=t.w;I.c+=t.net;t.profit=null;buy+=t.net}
  else{t.net=g+t.wage-t.tax-t.fee;var avg=I.w>0?I.c/I.w:0;t.profit=t.net-avg*t.w;I.c-=avg*t.w;I.w-=t.w;prof+=t.profit;sell+=t.net}
 });
 return{inv:inv,T:T,prof:prof,buy:buy,sell:sell};
}
function bal(pid,C){
 var b=0;C.T.forEach(function(t){if(t.person==pid){var d=t.net-t.paid;b+=t.type=='buy'?-d:d}});
 S.pay.forEach(function(p){if(p.person==pid)b+=p.dir=='in'?-p.amt:p.amt});
 return b;
}
function pname(id){var p=S.ps.filter(function(x){return x.id==id})[0];return p?p.name:'—'}
function balTxt(b){return b>0.5?'بدهکار '+money(b):b<-0.5?'بستانکار '+money(-b):'تسویه'}

var TABS=[['home','🏠','خانه'],['calc','🧮','حساب‌ها'],['inv','🗂','موجودی'],['tx','🧾','تراکنش‌ها']];
var IC=['<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/></svg>','<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>','<svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>','<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>'];for(var i=0;i<4;i++)TABS[i][1]=IC[i];document.getElementById('toolb').innerHTML='<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>';TABS[1][2]='حساب';var CAL={w:'',b:'',d:''};function go(v){V=v;render()}
var KE='',CB='<button class="cbtn" onclick="calcOpen()"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg></button>';
function cal(){var t=today().split('/'),w='';try{w=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long'}).format(new Date())}catch(e){}return '<span class="dt"><b>'+fd(+t[2])+'</b><span><small>'+w+'</small><small>'+MN[+t[1]-1]+' '+fd(t[0])+'</small></span></span>'}
function kd(){document.getElementById('kd').textContent=KE?KE.replace(/([÷×−+])/g,' $1 '):'0'}
function kp(k){if(k=='AC')KE='';else if(k=='⌫')KE=KE.slice(0,-1);else if(k=='='){try{var e=KE.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+\.?\d*)%/g,'($1/100)');if(e&&/^[0-9+\-*\/().\s]*$/.test(e)){var v=Function('return '+e)();if(isFinite(v))KE=String(Math.round(v*1e8)/1e8)}}catch(x){}}else if(k=='000'){if(/[0-9]$/.test(KE))KE+='000'}else if(/[÷×−+]/.test(k)){if(!KE&&k!='−')return;KE=KE.replace(/[÷×−+]$/,'')+k}else KE+=k;kd()}
function calcOpen(){var ks=['÷','%','AC','⌫','×','9','8','7','−','6','5','4','+','3','2','1','=','.','0','000'];sheet('<div style="display:flex;justify-content:space-between;align-items:center"><button class="kx" onclick="cl()">✕</button><b style="font-size:18px">ماشین‌حساب</b><span style="width:44px"></span></div><div id="kd" class="kd"></div><div class="kg">'+ks.map(function(k){var op=/[÷×−+=]/.test(k),ac=k=='AC'||k=='%'||k=='⌫';return '<button class="kb'+(op?' ko':ac?' ka':'')+'" onclick="kp(\''+k+'\')">'+k+'</button>'}).join('')+'</div>');KE='';kd()}
function gp(){var u='https://alanchand.com/gold-price',w=null;try{w=window.open(u,'_blank')}catch(e){}if(!w)location.href=u}
function cc(){var w=num(fv('c_w')),b=num(fv('c_b')),d=num(fv('c_d'));CAL={w:fv('c_w'),b:fv('c_b'),d:fv('c_d')};var cost=w*b,now=w*d,df=now-cost,pc=cost?df/cost*100:0;function r(a,v){return '<div class="row"><div class="grow"><b>'+a+'</b></div><div class="num">'+v+'</div></div>'}document.getElementById('cres').innerHTML=r('مبلغ خرید',money(cost)+' تومان')+r('ارزش با قیمت روز',money(now)+' تومان')+r('سود / زیان',sgn(df,money(df)+' تومان'))+r('درصد',sgn(df,'٪'+(Math.round(pc*100)/100).toLocaleString('fa-IR')))}
function render(){
 var C=calc(),h='';
 document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="'+(V==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
 document.getElementById('toolb').className='tool'+(V=='tools'||V=='persons'?' on':'');
 document.body.className=HID?'hide':'';
 var eye='<button class="eye" onclick="HID=!HID;render()">'+(HID?'🙈':'👁')+'</button>';
 if(V=='home'){
  var ks={};Object.keys(C.inv).forEach(function(k){var I=C.inv[k];ks[I.karat]=(ks[I.karat]||0)+I.w});
  h+='<h1><span>خانه</span><span class="ttl">'+cal()+eye+'</span></h1><div class="card"><div class="grid"><div><small>مجموع خرید</small><b>'+m(money(C.buy))+'</b></div><div><small>مجموع فروش</small><b>'+m(money(C.sell))+'</b></div><div><small>سود و زیان کل</small><b>'+m(sgn(C.prof,money(C.prof)))+'</b></div></div><small style="color:var(--mu)">مبالغ به تومان</small></div>';
  h+='<div class="card"><h3>موجودی طلا <a onclick="go(\'inv\')">مشاهدهٔ همه</a></h3>';
  var kk=Object.keys(ks).sort(function(a,b){return b-a});
  h+=kk.length?kk.map(function(k){return '<div class="row"><div class="ic" style="background:var(--gold)">✦</div><div class="grow"><b>عیار '+fd(k)+'</b></div><div class="num">'+m(wt(ks[k])+' گرم')+'</div></div>'}).join(''):'<div class="empty">هنوز موجودی ثبت نشده</div>';
  h+='</div><div class="card"><h3>تراکنش‌های اخیر <a onclick="go(\'tx\')">مشاهدهٔ همه</a></h3>'+txRows(C.T.slice().reverse().slice(0,5))+'</div>';
  h+='<button class="btn s g" onclick="txForm()" style="margin-bottom:12px">تراکنش جدید</button><a class="coin" href="https://alanchand.com/gold-price" onclick="try{navigator.clipboard.writeText(\'https://alanchand.com/gold-price\')}catch(e){}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h11v4M4 8h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM20 13h-4a1.5 1.5 0 0 0 0 3h4"/></svg></a>';
 }
 if(V=='calc'){h+='<h1>حساب <span class="ttl">'+CB+eye+'</span></h1><div class="card"><div class="three"><div><label>وزن (گرم)</label><input id="c_w" inputmode="decimal" value="'+CAL.w+'" oninput="cc()"></div><div><label>قیمت خرید</label><input id="c_b" inputmode="decimal" value="'+CAL.b+'" oninput="cc()"></div><div><label>قیمت روز</label><input id="c_d" inputmode="decimal" value="'+CAL.d+'" oninput="cc()"></div></div><small style="color:var(--mu)">قیمت‌ها: تومان برای هر گرم</small></div><div class="card" id="cres"></div>'}
 if(V=='tx'){h+='<h1>تراکنش‌ها '+eye+'</h1><button class="btn g" onclick="txForm()">＋ تراکنش جدید</button><div class="card">'+txRows(C.T.slice().reverse())+'</div>'}
 if(V=='inv'){
  h+='<h1>موجودی '+eye+'</h1>';var ks=Object.keys(C.inv).filter(function(k){return Math.abs(C.inv[k].w)>0.0005}).sort();
  h+='<div class="card">'+(ks.length?ks.map(function(k){var I=C.inv[k];return '<div class="row"><div class="ic" style="background:var(--gold)">'+(I.item=='سکه'?'🪙':I.item=='زینتی'?'💍':'🧱')+'</div><div class="grow"><b>'+I.item+' · عیار '+fd(I.karat)+'</b><small>میانگین خرید '+m(money(I.w>0?I.c/I.w:0))+' / گرم</small></div><div class="num">'+m(wt(I.w)+' گرم')+'</div></div>'}).join(''):'<div class="empty">موجودی خالی است</div>')+'</div>';
 }
 if(V=='persons'){h+='<button class="btn s" onclick="go(\'tools\')">→ بازگشت به ابزارها</button><div style="height:8px"></div>';
  h+='<h1>حساب‌ها '+eye+'</h1><button class="btn g" onclick="pForm()">＋ شخص جدید</button><div class="card">';
  h+=S.ps.length?S.ps.map(function(p){var b=bal(p.id,C);return '<div class="row" onclick="pView(\''+p.id+'\')"><div class="ic" style="background:#5b5bd6">'+p.name.charAt(0)+'</div><div class="grow"><b>'+p.name+'</b><small>'+(p.tel?fd(p.tel):'')+'</small></div><div class="num">'+m(sgn(b,balTxt(b)))+'</div></div>'}).join(''):'<div class="empty">شخصی ثبت نشده</div>';
  h+='</div>';
 }
 if(V=='tools'){
  h+='<h1>ابزارها '+eye+'</h1><button class="btn" onclick="go(\'persons\')">👥 حساب اشخاص (بدهکار / بستانکار)</button><div class="seg" id="rs">'+[['d','روزانه'],['m','ماهانه'],['a','کل']].map(function(x){return '<button class="'+(RP==x[0]?'on':'')+'" onclick="RP=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join('')+'</div><div class="card">'+report(C)+'</div>';
  h+='<div class="card"><h3>خروجی Excel</h3><button class="btn s g" onclick="xl()">دانلود فایل Excel</button><div style="height:8px"></div><button class="btn s" onclick="cp(csv())">کپی جدول (برای چسباندن در Excel)</button></div>';
  h+='<div class="card"><h3>نسخهٔ پشتیبان</h3><button class="btn s g" onclick="bk()">دانلود پشتیبان</button><div style="height:8px"></div><button class="btn s" onclick="cp(JSON.stringify(S))">کپی پشتیبان</button><label>بازیابی: متن پشتیبان را اینجا بچسبانید</label><textarea id="rst" rows="3" class="mono"></textarea><div style="height:8px"></div><button class="btn s" onclick="rest()">بازیابی</button></div>';
 }
 document.getElementById('app').innerHTML=h;Array.prototype.forEach.call(document.querySelectorAll('.eye'),function(b){b.innerHTML=HID?'<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6C3.7 8.4 2 12 2 12s4 7 10 7c1.7 0 3.2-.5 4.5-1.2"/></svg>':'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'});if(V=='calc')cc();
}
var RP='d';
function report(C){
 var g={};C.T.forEach(function(t){var k=RP=='d'?t.date:RP=='m'?t.date.slice(0,7):'کل',G=g[k]||(g[k]={n:0,b:0,s:0,p:0});G.n++;if(t.type=='buy')G.b+=t.net;else{G.s+=t.net;G.p+=t.profit}});
 var ks=Object.keys(g).sort().reverse();if(!ks.length)return '<div class="empty">تراکنشی برای گزارش نیست</div>';
 return ks.map(function(k){var G=g[k];return '<div class="row" style="align-items:flex-start"><div class="grow"><b>'+(k=='کل'?'سود و زیان کل':RP=='m'?mname(k):fd(k))+'</b><small>'+fd(G.n)+' تراکنش · خرید '+m(money(G.b))+' · فروش '+m(money(G.s))+'</small></div><div class="num">'+m(sgn(G.p,money(G.p)))+'</div></div>'}).join('');
}
function txRows(L){
 if(!L.length)return '<div class="empty">تراکنشی ثبت نشده</div>';
 return L.map(function(t){var b=t.type=='buy';return '<div class="row" onclick="txView(\''+t.id+'\')"><div class="ic" style="background:'+(b?'#3b7ddd':'#1f9d55')+'">'+(b?'↓':'↑')+'</div><div class="grow"><b>'+(b?'خرید':'فروش')+' '+t.item+' · '+fd(t.karat)+'</b><small>'+wt(t.w)+' گرم · '+fd(t.date)+(t.person?' · '+pname(t.person):'')+'</small></div><div class="num">'+m((b?'−':'')+money(t.net))+(t.profit!=null?'<br><small>'+m(sgn(t.profit,'سود '+money(t.profit)))+'</small>':'')+'</div></div>'}).join('');
}
function sheet(h){var o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=function(e){if(e.target==o)cl()};o.innerHTML='<div class="sheet">'+h+'</div>';document.body.appendChild(o)}
function cl(){var o=document.getElementById('ov');if(o)o.remove()}
var TY='buy';
function txForm(){
 TY='buy';
 sheet('<h2>تراکنش جدید</h2><div class="seg"><button id="tb" class="on" onclick="setTy(\'buy\')">خرید</button><button id="ts" onclick="setTy(\'sell\')">فروش</button></div>'+
 '<div class="two"><div><label>نوع طلا</label><select id="f_item"><option>آب‌شده</option><option>سکه</option><option>زینتی</option></select></div><div><label>عیار</label><select id="f_k"><option>18</option><option>24</option><option>22</option><option>21</option><option>14</option><option>9</option></select></div></div>'+
 '<div class="two"><div><label>وزن (گرم)</label><input id="f_w" inputmode="decimal" oninput="sm()"></div><div><label>قیمت هر گرم (تومان)</label><input id="f_p" inputmode="decimal" oninput="sm()"></div></div>'+
 '<div class="two"><div><label>اجرت</label><input id="f_wage" inputmode="decimal" oninput="sm()"></div><div><label>مالیات</label><input id="f_tax" inputmode="decimal" oninput="sm()"></div></div>'+
 '<div class="two"><div><label>کارمزد</label><input id="f_fee" inputmode="decimal" oninput="sm()"></div><div><label>تاریخ (شمسی)</label><input id="f_d" value="'+fd(today())+'"></div></div>'+
 '<label>شخص (اختیاری)</label><select id="f_per" onchange="sm()"><option value="">— بدون شخص —</option>'+S.ps.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>'}).join('')+'</select>'+
 '<div id="paidbox" style="display:none"><label id="paidl">مبلغ پرداختی</label><input id="f_paid" inputmode="decimal" placeholder="خالی = تسویه کامل"></div>'+
 '<label>توضیحات</label><input id="f_note"><div class="sum" id="sm">—</div><div style="height:12px"></div><button class="btn g" onclick="saveTx()">ذخیره</button>');
}
function setTy(t){TY=t;document.getElementById('tb').className=t=='buy'?'on':'';document.getElementById('ts').className=t=='sell'?'on':'';sm()}
function fv(i){return document.getElementById(i).value}
function sm(){
 var w=num(fv('f_w')),p=num(fv('f_p')),wg=num(fv('f_wage')),tx=num(fv('f_tax')),fe=num(fv('f_fee')),g=w*p,b=TY=='buy',net=b?g+wg+tx+fe:g+wg-tx-fe;
 document.getElementById('paidbox').style.display=fv('f_per')?'block':'none';
 document.getElementById('paidl').textContent=b?'مبلغ پرداختی':'مبلغ دریافتی';
 document.getElementById('sm').innerHTML='مبلغ طلا: <b>'+money(g)+'</b><br>'+(b?'هزینهٔ کل (با اجرت، مالیات، کارمزد)':'خالص دریافتی')+': <b>'+money(net)+'</b> تومان';
}
function saveTx(){
 var w=num(fv('f_w')),p=num(fv('f_p')),d=nd(fv('f_d'));
 if(w<=0||p<=0){alert('وزن و قیمت هر گرم را وارد کنید');return}
 if(!d){alert('تاریخ را مثل ۱۴۰۵/۰۸/۱۰ وارد کنید');return}
 var t={id:uid(),type:TY,item:fv('f_item'),karat:fv('f_k'),w:w,p:p,wage:num(fv('f_wage')),tax:num(fv('f_tax')),fee:num(fv('f_fee')),date:d,person:fv('f_per'),note:fv('f_note')};
 var net=TY=='buy'?w*p+t.wage+t.tax+t.fee:w*p+t.wage-t.tax-t.fee;
 t.paid=t.person&&fv('f_paid')!==''?num(fv('f_paid')):net;
 if(TY=='sell'){var I=calc().inv[t.item+'|'+t.karat];if(!I||I.w<w-0.0005&&!confirm('موجودی این عیار کافی نیست. ثبت شود؟'))return}
 S.tx.push(t);save();cl();render();
}
function txView(id){
 var t=calc().T.filter(function(x){return x.id==id})[0],b=t.type=='buy';
 sheet('<h2>'+(b?'خرید':'فروش')+' '+t.item+' · عیار '+fd(t.karat)+'</h2><div class="sum">تاریخ: '+fd(t.date)+'<br>وزن: '+wt(t.w)+' گرم<br>قیمت هر گرم: '+money(t.p)+'<br>اجرت: '+money(t.wage)+' · مالیات: '+money(t.tax)+' · کارمزد: '+money(t.fee)+'<br>'+(b?'هزینهٔ کل':'خالص فروش')+': <b>'+money(t.net)+'</b>'+(t.profit!=null?'<br>سود و زیان: <b>'+sgn(t.profit,money(t.profit))+'</b>':'')+(t.person?'<br>شخص: '+pname(t.person)+'<br>'+(b?'پرداختی':'دریافتی')+': '+money(t.paid):'')+(t.note?'<br>'+t.note:'')+'</div><div style="height:12px"></div><button class="btn" style="color:var(--rd)" onclick="delTx(\''+id+'\')">حذف تراکنش</button>');
}
function delTx(id){if(confirm('این تراکنش حذف شود؟')){S.tx=S.tx.filter(function(x){return x.id!=id});save();cl();render()}}
function pForm(){sheet('<h2>شخص جدید</h2><label>نام</label><input id="p_n"><label>تلفن (اختیاری)</label><input id="p_t" inputmode="tel"><div style="height:14px"></div><button class="btn g" onclick="saveP()">ذخیره</button>')}
function saveP(){var n=fv('p_n').trim();if(!n)return;S.ps.push({id:uid(),name:n,tel:fv('p_t')});save();cl();render()}
function pView(id){
 var C=calc(),p=S.ps.filter(function(x){return x.id==id})[0],b=bal(id,C);
 var L=C.T.filter(function(t){return t.person==id}).reverse();
 sheet('<h2>'+p.name+'</h2><div class="sum">مانده: <b>'+sgn(b,balTxt(b))+'</b> تومان</div><label>ثبت پرداخت یا دریافت</label><div class="two"><input id="py_a" inputmode="decimal" placeholder="مبلغ"><select id="py_d"><option value="in">دریافت از او</option><option value="out">پرداخت به او</option></select></div><div style="height:10px"></div><button class="btn s g" onclick="addPay(\''+id+'\')">ثبت</button><h3 style="margin:16px 4px 4px">تراکنش‌ها</h3>'+(txRows(L))+'<div style="height:12px"></div><button class="btn s" style="color:var(--rd)" onclick="delP(\''+id+'\')">حذف شخص</button>');
}
function addPay(id){var a=num(fv('py_a'));if(a<=0)return;S.pay.push({id:uid(),person:id,amt:a,dir:fv('py_d'),date:today()});save();cl();render()}
function delP(id){if(confirm('شخص حذف شود؟ تراکنش‌ها می‌مانند.')){S.ps=S.ps.filter(function(x){return x.id!=id});save();cl();render()}}
// خروجی و پشتیبان
function rows(){var C=calc();return [['تاریخ','نوع','کالا','عیار','وزن','قیمت گرم','اجرت','مالیات','کارمزد','مبلغ نهایی','سود و زیان','شخص','توضیحات']].concat(C.T.map(function(t){return [fd(t.date),t.type=='buy'?'خرید':'فروش',t.item,t.karat,t.w,t.p,t.wage,t.tax,t.fee,Math.round(t.net),t.profit==null?'':Math.round(t.profit),t.person?pname(t.person):'',t.note||'']}))}
function csv(){return rows().map(function(r){return r.join('\t')}).join('\n')}
function dl(name,type,data){try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+data],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){alert('اگر دانلود شروع نشد، از دکمهٔ «کپی» استفاده کنید.')},600)}catch(e){alert('دانلود در این محیط ممکن نیست؛ از دکمهٔ «کپی» استفاده کنید.')}}
function xl(){var h='<html dir="rtl"><meta charset="utf-8"><table border="1">'+rows().map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table></html>';dl('gold-report.xls','application/vnd.ms-excel',h)}
function bk(){dl('gold-backup.json','application/json',JSON.stringify(S))}
function cp(t){try{navigator.clipboard.writeText(t).then(function(){alert('کپی شد')},function(){fb(t)})}catch(e){fb(t)}}
function fb(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');alert('کپی شد')}catch(e){alert('کپی نشد')}a.remove()}
function rest(){try{var o=JSON.parse(fv('rst'));if(!o.tx||!o.ps)throw 0;if(confirm('اطلاعات فعلی جایگزین شود؟')){S={tx:o.tx,ps:o.ps,pay:o.pay||[]};save();render()}}catch(e){alert('متن پشتیبان معتبر نیست')}}
document.addEventListener('click',function(e){var a=document.activeElement;if((V=='calc'||document.getElementById('ov'))&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!e.target.closest('input,select,textarea,label'))a.blur()});
render();
</script>
